name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build unsigned ipa
        run: |
          set -x
          PROJ=$(find . -maxdepth 4 -name "*.xcodeproj" -not -path "*/Pods/*" -not -path "*/external/*" | head -1)
          echo "PROJ=$PROJ"
          xcodebuild -project "$PROJ" -list
          SCHEME=$(xcodebuild -project "$PROJ" -list 2>/dev/null | awk '/Schemes:/{f=1;next} f&&NF&&!/-/{print $1; exit}')
          echo "SCHEME=$SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: unsigned.ipa
